<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reception Invitation</title>
  <meta name="description" content="You are invited to our reception.">
  <meta name="theme-color" content="#0b1033">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237a1d33'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%23e6c477' stroke-width='2'/%3E%3Cpath d='M32 20l3.5 8.5L44 32l-8.500 3.500L32 44l-3.500-8.500L20 32l8.500-3.500z' fill='%23f3d58a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="stage" aria-label="Animated reception invitation">

  <!-- ========== SCENE 1 · A magical beginning (twilight palace garden) ========== -->
  <section class="scene" id="s1">
    <div class="world"><div class="rig">
      <img class="layer" data-plate="garden-sky" data-depth="0.25" alt="">
      <img class="layer" data-plate="garden-far" data-depth="0.5" alt="">
      <img class="layer" data-plate="garden-mid" data-depth="1" alt="">
    </div></div>
    <div class="fg fg-bl"><img data-effect="foliage-fg" alt=""></div>
    <div class="fg fg-br"><img data-effect="foliage-fg" alt=""></div>
  </section>

  <!-- ========== SCENE 2 · Introducing the groom (palace courtyard at dusk) ========== -->
  <section class="scene" id="s2">
    <div class="world"><div class="rig">
      <img class="layer" data-plate="courtyard-sky" data-depth="0.25" alt="">
      <img class="layer" data-plate="courtyard-palace" data-depth="0.7" alt="">
      <img class="layer" data-plate="courtyard-near" data-depth="1.25" alt="">
    </div></div>
    <div class="actor actor-groom" id="groom">
      <div class="actor-shadow"></div>
      <div class="actor-move"><div class="actor-idle">
        <img class="actor-img" data-char="groom" alt="Illustration of the groom">
        <div class="sheen" data-mask="groom"></div>
        <i class="glint" style="left:75.5%;top:5.6%"></i><i class="glint" style="left:53%;top:21.5%"></i><i class="glint" style="left:44%;top:63%"></i>
      </div></div>
    </div>
  </section>

  <!-- ========== SCENE 3 · Introducing the bride (terrace above the illuminated garden) ========== -->
  <section class="scene" id="s3">
    <div class="world"><div class="rig">
      <img class="layer" data-plate="terrace-sky" data-depth="0.25" alt="">
      <img class="layer" data-plate="terrace-vista" data-depth="0.6" alt="">
    </div></div>
    <div class="actor actor-bride" id="bride">
      <img class="rail" data-effect="balustrade" alt="">
      <div class="actor-move"><div class="actor-idle">
        <img class="actor-img" data-char="bride" alt="Illustration of the bride">
        <div class="sheen" data-mask="bride"></div>
        <i class="glint" style="left:47.4%;top:6.9%"></i><i class="glint" style="left:56.6%;top:15%"></i><i class="glint" style="left:66.5%;top:8.7%"></i><i class="glint" style="left:57%;top:47%"></i><i class="glint" style="left:74%;top:71%"></i>
      </div></div>
    </div>
  </section>

  <!-- ========== SCENE 4 · A celebration of togetherness (blue-hour garden) ========== -->
  <section class="scene" id="s4">
    <div class="world"><div class="rig">
      <img class="layer" data-plate="bluehour-sky" data-depth="0.25" alt="">
      <img class="layer" data-plate="bluehour-garden" data-depth="0.8" alt="">
    </div></div>
    <div class="cameo" id="portrait">
      <div class="portrait-halo"></div>
      <img class="portrait-ring" data-effect="floral-ring" alt="">
      <div class="portrait-pair" id="pairPortrait"><img data-char="couple" alt="Illustration of the couple together"></div>
      <div class="portrait-duo" id="pairDuo"><img class="pd-groom" data-char="groom" alt=""><img class="pd-bride" data-char="bride" alt=""></div>
      <img class="portrait-bed" data-effect="rose-bed" alt="">
    </div>
  </section>

  <!-- ========== SCENES 5–7 · The reception stage ========== -->
  <section class="scene" id="s5">
    <div class="world"><div class="rig">
      <img class="layer" data-plate="stage-back" data-depth="0.45" alt="">
      <img class="layer" data-plate="stage-stage" data-depth="1" alt="">
      <img class="layer twinkle" id="twA" data-plate="stage-lightsA" data-depth="1" alt="">
      <img class="layer twinkle" id="twB" data-plate="stage-lightsB" data-depth="1" alt="">
    </div></div>
    <div class="stage-dim" id="stageDim"></div>
    <div class="duo" id="duo">
      <img class="rail" data-effect="balustrade" alt="">
      <div class="duo-shadow"></div>
      <div class="actor-move duo-groom"><div class="actor-idle"><img data-char="groom" alt="Illustration of the groom"></div></div>
      <div class="actor-move duo-bride"><div class="actor-idle"><img data-char="bride" alt="Illustration of the bride"></div></div>
    </div>
    <div class="fg duo-bed" id="duoBed"><img data-effect="rose-bed" alt=""></div>
  </section>

  <!-- particles: petals, fireflies, gold dust, sparkles -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- floral frame that grows in at the end of scene 1 -->
  <div id="frame" aria-hidden="true">
    <div class="frame-line"></div>
    <div class="frame-corner tl"><img data-effect="corner-floral" alt=""></div>
    <div class="frame-corner tr"><img data-effect="corner-floral" alt=""></div>
    <div class="frame-corner bl"><img data-effect="corner-floral" alt=""></div>
    <div class="frame-corner br"><img data-effect="corner-floral" alt=""></div>
  </div>

  <!-- all on-screen wording (filled in from config.js) -->
  <div id="copy">
    <div class="copy c1"><p class="t-opening" data-text="opening" data-split="letters"></p></div>
    <div class="copy c2">
      <div class="copy-veil"></div>
      <p class="t-label" data-text="groomLabel" data-split="letters"></p>
      <h2 class="t-name" data-name="groom"></h2>
      <div class="t-flourish"></div>
    </div>
    <div class="copy c3">
      <div class="copy-veil"></div>
      <p class="t-label" data-text="brideLabel" data-split="letters"></p>
      <h2 class="t-name" data-name="bride"></h2>
      <div class="t-flourish"></div>
    </div>
    <div class="copy c4">
      <div class="c4-veil"></div>
      <p class="t-line" data-together="0" data-split="letters"></p>
      <p class="t-line" data-together="1" data-split="letters"></p>
      <p class="t-line t-line-accent" data-together="2"></p>
    </div>
    <div class="copy c5">
      <div class="c5-veil"></div>
      <h2 class="t-couple"><span class="n" data-name="bride"></span><span class="amp">&amp;</span><span class="n" data-name="groom"></span></h2>
      <div class="t-flourish"></div>
      <p class="t-invite"><span data-text="inviteLine" data-split="letters"></span><strong data-event-type></strong></p>
      <p class="t-message" data-text="message" data-split="words"></p>
    </div>
    <div class="copy c7">
      <div class="c7-veil"></div>
      <p class="t-closing" data-closing="0" data-split="words"></p>
      <p class="t-closing t-closing-2" data-closing="1" data-split="words"></p>
      <h2 class="t-sign" data-sign></h2>
      <p class="t-foot" data-foot></p>
    </div>
  </div>

  <!-- SCENE 6 · the invitation card -->
  <div id="cardLayer">
    <article class="card" id="card">
      <div class="card-floral tl"><img data-effect="corner-floral" alt=""></div>
      <div class="card-floral br"><img data-effect="corner-floral" alt=""></div>
      <div class="card-shine"></div>
      <div class="card-body">
        <p class="card-kicker" data-event-type></p>
        <h2 class="card-names"><span data-name="bride"></span><span class="amp">&amp;</span><span data-name="groom"></span></h2>
        <div class="card-rule"><i></i><b>&#10022;</b><i></i></div>
        <p class="card-date" data-date></p>
        <p class="card-time" data-time hidden></p>
        <p class="card-label" data-text="venueLabel"></p>
        <p class="card-venue" data-venue></p>
        <p class="card-address" data-address></p>
        <p class="card-rsvp" data-rsvp hidden></p>
      </div>
    </article>
  </div>

  <div id="bloom" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>

  <!-- velvet curtains that part to reveal the reception stage -->
  <div id="curtains" aria-hidden="true">
    <div class="curtain curtain-l"><i></i></div>
    <div class="curtain curtain-r"><i></i></div>
    <div class="curtain-top"></div>
  </div>

  <!-- the sealed envelope the film opens from -->
  <div id="envelope">
    <div class="env-base"></div>
    <div class="flap flap-b"><i></i></div>
    <div class="flap flap-l"><i></i></div>
    <div class="flap flap-r"><i></i></div>
    <div class="flap flap-t"><i></i></div>
    <div class="env-copy env-copy-top"><p class="env-kicker" data-text="envelopeKicker"></p></div>
    <div class="env-copy env-copy-bottom"><p class="env-names" data-sign></p></div>
    <button id="seal" type="button" aria-label="Open the invitation">
      <span class="seal-ring"></span>
      <img data-effect="seal" alt="">
      <span class="seal-mono" data-monogram></span>
    </button>
    <p class="env-hint" id="hint" data-text="tapToOpen"></p>
  </div>

  <!-- final screen (website only) -->
  <div id="end" hidden>
    <div class="end-inner">
      <p class="end-kicker" data-event-type></p>
      <h2 class="end-names" data-sign></h2>
      <p class="end-date" data-date></p>
      <p class="end-venue" data-venue></p>
      <p class="end-address" data-address-inline></p>
      <div class="end-actions">
        <button type="button" id="btnReplay">Watch again</button>
        <a id="btnMap" target="_blank" rel="noopener">Directions</a>
        <button type="button" id="btnCal">Save the date</button>
      </div>
    </div>
  </div>

  <!-- playback controls (website only) -->
  <div id="ui">
    <div class="ui-progress"><i id="progress"></i></div>
    <div class="ui-buttons">
      <button type="button" id="btnPlay" aria-label="Pause">
        <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
      <button type="button" id="btnMute" aria-label="Mute music">
        <svg class="ic-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-2-3.15v6.3a3.5 3.5 0 0 0 2-3.15zM13.5 3.3v2.1a7 7 0 0 1 0 13.2v2.1a9 9 0 0 0 0-17.4z"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm15.3 3l2.2-2.2-1.4-1.4-2.2 2.2-2.2-2.2-1.4 1.4 2.2 2.2-2.2 2.2 1.4 1.4 2.2-2.2 2.2 2.2 1.4-1.4z"/></svg>
      </button>
      <button type="button" id="btnAgain" aria-label="Replay from the beginning">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>
  </div>

  <div id="loading"><div class="loading-mark"><span data-monogram></span></div><p>Preparing your invitation…</p></div>
</main>

<audio id="music" preload="auto"></audio>

<script src="config.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
